name: Publish GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'profiles/**'
      - 'package.json'
      - 'package-lock.json'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'scripts/site-policy-lib.mjs'
      - 'scripts/check-site-sync.mjs'
      - 'scripts/check-site-release.mjs'
      - 'scripts/build-site.mjs'
      - 'scripts/site-lib.mjs'
      - 'scripts/conversion-case-lib.mjs'
      - 'scripts/prose-example-lib.mjs'
      - 'tests/site.test.ts'
      - 'examples/**'
      - 'skills/**'
      - 'templates/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/configure-pages@v5
      - name: Check website synchronization
        env:
          SITE_SYNC_BASE: ${{ github.event.before }}
        run: node scripts/check-site-sync.mjs
      - run: node scripts/build-site.mjs
      - run: node scripts/check-site-release.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
